# Status-line pastilles agents — à sourcer depuis ~/.tmux.conf :
#   source-file ~/.config/tmux/statusline.conf
# Prérequis : pastilles.sh copié dans ~/.config/tmux/ (chmod +x)
# MIT — Yannick Goalen (https://github.com/yg0a1n/tmux-agents-statusline)

set -g status-position top
set -g status-interval 5
set -g status-style bg=colour235,fg=colour223
set -g status-left-length 120
set -g status-right-length 60

# Nom de session + pastilles d'état des agents
set -g status-left "#[fg=colour108,bold] #S #[default] #(PASTILLE_AGENTS='agent-os builder designer growth admin saas' bash ~/.config/tmux/pastilles.sh render) "

set -g status-right "#[fg=colour246]%d/%m #[fg=colour223]%H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour214,bold] #I:#W #[default]"

# Bonus : pastille bleue sur l'onglet d'un agent qui « sonne » (bell), auto-effacée au focus
set -g window-status-bell-style "bg=colour33,fg=colour231,bold"
